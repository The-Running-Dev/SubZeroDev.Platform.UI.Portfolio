name: Deploy Portfolio site to GitHub Pages

# This workflow supplies no trigger, domain, environment name, or
# concurrency policy - the caller's own workflow owns all of that and calls
# this one through `uses:` (design/20-contract.md, "Delivery assets"; P33).

on:
  workflow_call:
    inputs:
      package-version:
        description: Exact npm package version to install and invoke. Required, never defaulted to "latest".
        required: true
        type: string
      root:
        description: Site root directory
        required: true
        type: string
      config:
        description: Path to the site configuration module
        required: true
        type: string
      out-dir:
        description: Build output directory
        required: true
        type: string
      target-dir:
        description: Deployment tree the built site is merged into and uploaded from
        required: true
        type: string
      protect:
        description: Newline-separated list of target-relative paths merge must not overwrite
        required: false
        type: string
      docs-artifact:
        description: Name of a separately built documentation artifact to download into target-dir before merging
        required: false
        type: string
    outputs:
      page_url:
        value: ${{ jobs.deploy.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - if: inputs.docs-artifact != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.docs-artifact }}
          path: ${{ inputs.target-dir }}

      # A relative `./` action reference resolves against this reusable
      # workflow's own repository and ref, not the caller's checkout above -
      # no separate pin is needed for an action that already lives beside
      # the workflow invoking it.
      - uses: ./
        with:
          package-version: ${{ inputs.package-version }}
          command: build
          root: ${{ inputs.root }}
          config: ${{ inputs.config }}
          out-dir: ${{ inputs.out-dir }}

      - uses: ./
        with:
          package-version: ${{ inputs.package-version }}
          command: merge
          artifact-dir: ${{ inputs.out-dir }}
          target-dir: ${{ inputs.target-dir }}
          protect: ${{ inputs.protect }}

      - id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.target-dir }}

      - id: deployment
        uses: actions/deploy-pages@v5
